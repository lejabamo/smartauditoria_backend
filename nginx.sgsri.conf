server {
    listen 80;
    server_name riesgosti.tics.sedcauca.gov.co _;

    return 301 https://riesgosti.tics.sedcauca.gov.co$request_uri;
}

server {
    listen 443 ssl;
    server_name riesgosti.tics.sedcauca.gov.co;

    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/riesgosti.tics.sedcauca.gov.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/riesgosti.tics.sedcauca.gov.co/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:5000/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Bloquear acceso a archivos y carpetas ocultas (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
