server {
    listen 80;
    server_name _;

    # Health check del engine (público)
    location /health {
        proxy_pass http://engine:8001/health;
        proxy_set_header Host $host;
    }

    # API del engine (proxy hacia FastAPI — protegido por API KEY a nivel app)
    location /api/v1/ {
        proxy_pass http://engine:8001/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
