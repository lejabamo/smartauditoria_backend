services:
  # ==========================================================================
  # DATABASE — MariaDB 10.11
  # Solo accesible internamente desde el backend
  # ==========================================================================
  db:
    image: mariadb:10.11
    container_name: smartauditoria_db
    restart: always
    env_file:
      - ./smartauditoria_backend/.env.production
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-_VPdJqnuMcYYEORcxH7OHA}
      MYSQL_DATABASE: sgsri_db
      MYSQL_USER: sgsri_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-KV2jiFc7fetfJH7-zFcoWQ}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - /data/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-_VPdJqnuMcYYEORcxH7OHA}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ==========================================================================
  # BACKEND — Flask + Gunicorn
  # Accesible solo via Nginx (127.0.0.1:5000)
  # ==========================================================================
  backend:
    build:
      context: ./smartauditoria_backend
      dockerfile: Dockerfile
    image: smartauditoria_backend:latest
    container_name: smartauditoria_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./smartauditoria_backend/.env.production
    ports:
      - "127.0.0.1:5000:5000"
    command: gunicorn -c gunicorn_config.py 'run:app'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ==========================================================================
  # FRONTEND — Nginx sirviendo React build + proxy /api → backend
  # Puerto 80 expuesto al exterior
  # ==========================================================================
  frontend:
    build:
      context: ./smartauditoria_frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    image: smartauditoria_frontend:latest
    container_name: smartauditoria_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.sgsri.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
