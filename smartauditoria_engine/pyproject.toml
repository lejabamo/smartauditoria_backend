[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartauditoria-engine"
version = "1.0.0"
description = "Motor RAG para SmartAuditorIA — Sugerencias y justificaciones normativas ISO"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "chromadb>=0.5.3",
    "numpy<2.0",
    "sentence-transformers>=2.7.0",
    "langchain>=0.1.12",
    "langchain-community>=0.0.29",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "google-generativeai>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pytest-cov>=5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

